# MyRoboTaxi iOS — XcodeGen spec (MYR-161).
# The .xcodeproj is NOT checked in; regenerate it any time with:
#   xcodegen generate
name: MyRoboTaxi

options:
  bundleIdPrefix: app.myrobotaxi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  DesignSystem:
    path: Packages/DesignSystem
  MyRoboTaxiKit:
    path: Packages/MyRoboTaxiKit
  # MYR-201 — the app's live telemetry adapter names generated contracts types
  # (`VehicleState`, `VehicleSummary`) directly, so it links the contracts
  # product explicitly (same version the Kit resolves — SPM dedupes).
  contracts:
    url: https://github.com/myrobotaxi/contracts.git
    # MYR-320 — 0.18.0 adds the two REST-only detail-sheet strings on
    # `VehicleState`: `trimLabel` (display-ready "Performance"; the raw `trim`
    # badge code is never rendered) and `fsdVersion` ("FSD (Supervised) v14.3.5",
    # rendered verbatim). Both snapshot-only. (0.17.0 added
    # `serviceEstimatedEndAt`; 0.16.0 the media now-playing fields +
    # `seatCoolingCapable`.)
    #
    # MYR-368 — 0.22.0 adds `ShareInvite.shareUrl`, the COMPLETE server-minted
    # SIGNED join link (`/join/{CODE}?k={kid}.{exp}.{sig}&from=&to=`). The app
    # target names `ShareInvite` directly (`DebugShareEndpoint`), so this pin has
    # to move with the Kit's rather than relying on SPM's dedupe to carry it.
    #
    # MYR-369 — 0.23.0 turns the share TIER into two per-grant FLAGS:
    # `ShareInvite.allowRides` + `ShareInvite.suspended` (owner-only, accepted
    # rows only) and the new `PatchShareInviteRequest`. `SharePermission` is no
    # longer a total order — see the Kit's `Package.swift` for the full note. The
    # app target names `ShareInvite`/`SharePermission` directly (`DebugShareEndpoint`,
    # `DebugScenes`), so this pin moves with the Kit's, same reason as 0.22.0.
    #
    # MYR-172 — 0.24.0 adds the Live Activity family (rest-api.md §7.21). The full
    # reasoning lives in the Kit's `Package.swift`; the short version for THIS pin
    # is that the app target and the WIDGET EXTENSION both name generated types
    # directly — `LiveActivityRideStatus` is carried inside
    # `RideActivityAttributes.ContentState` (so it is in the extension's compiled
    # surface, not just the app's), and `LiveActivityContentState` is the authority
    # `RideActivityContentStateTests` pins that mirror against. Three targets now
    # depend on this one version, so it must not rely on SPM's dedupe to carry it.
    from: 0.24.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  MyRoboTaxi:
    type: application
    platform: iOS
    sources:
      - App/Sources
      # MYR-172 — the ActivityAttributes + the Activity's copy, compiled into BOTH
      # this target and `MyRoboTaxiWidgets`. Shared as a source folder rather than
      # as a fourth local SPM package: it is one value type and one copy table with
      # no behaviour, so a package would add a module boundary, a
      # `public`-everything surface and a second place to bump the contracts pin,
      # and buy nothing two `sources:` entries do not. See
      # `App/ActivityShared/RideActivityAttributes.swift`.
      - App/ActivityShared
    dependencies:
      - package: DesignSystem
      - package: MyRoboTaxiKit
      - package: contracts
        product: MyRobotaxiContracts
      # MYR-172 — the widget extension carrying the Live Activity presentation.
      # `embed: true` puts it in the app's `PlugIns/` directory, which is what makes
      # ActivityKit able to find a presentation for `RideActivityAttributes` at all;
      # an extension that is built but not embedded fails at `Activity.request`
      # rather than at build time.
      - target: MyRoboTaxiWidgets
        embed: true
    # MYR-164 — Sign In with Apple capability. XcodeGen writes/owns this
    # entitlements file and sets CODE_SIGN_ENTITLEMENTS. The `Default`
    # authorization scope is the standard native-app value.
    entitlements:
      path: App/MyRoboTaxi.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # MYR-186 — APNs. Same XcodeGen mechanism as the SIWA entitlement above:
        # this file is generated/owned by XcodeGen and referenced through
        # CODE_SIGN_ENTITLEMENTS, so it is never hand-edited.
        #
        # The committed value is `development` — the SANDBOX APNs environment a
        # Debug/device build is signed into. It is deliberately NOT config-split:
        # `xcodebuild -exportArchive` re-signs the archive with the managed
        # App Store DISTRIBUTION profile (ExportOptions.plist, automatic signing),
        # and that profile carries `aps-environment: production`, which wins for
        # the exported .ipa. So TestFlight and App Store builds talk to production
        # APNs while local device builds talk to sandbox, with one declared value.
        #
        # The app's `sandbox` flag on PUT /api/push/devices mirrors this exactly:
        # it is the DEBUG compile flag, so a TestFlight build (Release) correctly
        # registers as production. See `PushEnvironment`.
        #
        # PORTAL STEP (client): the `app.myrobotaxi.ios` App ID needs the Push
        # Notifications capability enabled before a managed profile can carry this
        # entitlement. Builds compile and every test passes without it — only real
        # on-device registration fails until it is turned on.
        aps-environment: development
        # MYR-346 — Associated Domains, for the `https://myrobotaxi.app/join/{CODE}`
        # invite links. Same XcodeGen mechanism as the two entitlements above:
        # this file is generated/owned by XcodeGen and referenced through
        # CODE_SIGN_ENTITLEMENTS, so it is never hand-edited.
        #
        # NOT config-split, and unlike `aps-environment` it does not need to be:
        # `applinks:` carries no dev/prod axis. The development-vs-production
        # distinction for universal links lives in how iOS FETCHES the AASA, not
        # in the entitlement string — while the web side is still deploying,
        # bypass Apple's CDN at the OS level (Settings ▸ Developer ▸ Associated
        # Domains Development) rather than by writing a different value here.
        # One declared value therefore serves Debug, TestFlight and App Store.
        #
        # THREE THINGS MUST AGREE or the link silently opens Safari instead:
        #   1. this entitlement;
        #   2. `https://myrobotaxi.app/.well-known/apple-app-site-association`
        #      serving appID `NFKX777598.app.myrobotaxi.ios` with components
        #      `/join/*`, over https, no redirects, `Content-Type: application/json`;
        #   3. the provisioning profile the build is signed with.
        # `InviteLink.host` is the client-side source of truth for (1) and (2),
        # and `InviteLinkHostTests` asserts this string against it.
        #
        # PORTAL STEP (client) — DONE 2026-07-29: Associated Domains is enabled on
        # the `app.myrobotaxi.ios` App ID and the App Store profile was
        # REGENERATED to pick it up ("MyRoboTaxi App Store",
        # f466e22b-6d46-427e-8415-4dabaed9a7de). A profile minted before that date
        # does NOT carry `com.apple.developer.associated-domains` and fails the
        # entitlement check at export — see RELEASING.md, including the
        # two-profiles-with-one-name trap the regeneration created.
        com.apple.developer.associated-domains:
          - applinks:myrobotaxi.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.myrobotaxi.ios
        # MYR-247 — first TestFlight release is 1.0.0. MARKETING_VERSION is the
        # public version string (CFBundleShortVersionString). CURRENT_PROJECT_VERSION
        # is the build number (CFBundleVersion): it MUST be unique+monotonic per
        # upload to App Store Connect. Keep "1" as the committed baseline and
        # override it at archive time (RELEASING.md):
        #   xcodebuild ... CURRENT_PROJECT_VERSION=$BUILD_NUMBER archive
        # so re-uploads without a version bump don't collide.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # MYR-246 — additive Info.plist carrying the myrobotaxi:// URL scheme
        # (in-app Tesla-link callback, §7.11). Xcode merges the GENERATE_INFOPLIST_FILE
        # keys on top; this file holds only keys with no INFOPLIST_KEY_* equivalent.
        INFOPLIST_FILE: App/MyRoboTaxi-Info.plist
        # MYR-238 — wire the app icon; AppIcon.appiconset lives in
        # App/Sources/Assets.xcassets (single 1024x1024 universal entry).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # MYR-247 — export compliance. The app uses only standard HTTPS/TLS
        # (exempt encryption), so declare it up front to skip the manual
        # "missing compliance" prompt on every TestFlight build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # MYR-211 — when-in-use location for the rider's live map + "Current
        # location" pickup (live mode only; sim never requests it).
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Shows where you are and sets your pickup point."
        TARGETED_DEVICE_FAMILY: "1"
        # MYR-164 — automatic signing + the paid team so a device build resolves a
        # managed profile carrying the Sign In with Apple entitlement. Simulator
        # builds do not require a provisioning profile (CODE_SIGNING_ALLOWED is NO
        # for the simulator SDK), so this never prompts for sim runs.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NFKX777598
      configs:
        # MYR-172 — RELEASE is FULL-MANUAL, per target, because the archive-time
        # command-line override (PROVISIONING_PROFILE_SPECIFIER=...) applies to
        # EVERY target at once and cannot name two profiles. Debug/simulator
        # stays Automatic above, so tests never prompt. The archive command now
        # passes only CURRENT_PROJECT_VERSION (RELEASING.md).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution: Thomas Nandola (NFKX777598)"
          PROVISIONING_PROFILE_SPECIFIER: MyRoboTaxi App Store

  # MYR-172 — the widget extension. V1 renders exactly one thing: the rider's ride
  # Live Activity (home-screen / lock-screen / StandBy widgets are explicit
  # follow-ups). It is a separate PROCESS from the app, which is why it links
  # DesignSystem and contracts directly and links MyRoboTaxiKit NOT AT ALL — a
  # process that renders a lock screen has no business carrying a REST client or an
  # auth token provider.
  MyRoboTaxiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets/Sources
      - App/ActivityShared
    dependencies:
      - package: DesignSystem
      - package: contracts
        product: MyRobotaxiContracts
    # The extension declares NO entitlements file. That is deliberate and is the
    # answer to "what does the new provisioning profile need to carry": nothing
    # beyond a plain App Store profile for the bundle id.
    #
    #   • Live Activities are enabled by the HOST app's `NSSupportsLiveActivities`
    #     Info.plist key (see App/MyRoboTaxi-Info.plist), not by any entitlement.
    #   • Push-to-update goes to the APNs topic `app.myrobotaxi.ios.push-type.
    #     liveactivity` — built from the HOST app's bundle id — so the host's
    #     existing `aps-environment` entitlement is what authorises it. The
    #     extension needs no `aps-environment` of its own and must not declare one.
    #   • No App Group: the Activity's content arrives over APNs and at
    #     `Activity.request`, so the two processes share no container. Adding one
    #     would be a capability on the profile with nothing behind it.
    info:
      path: Widgets/MyRoboTaxiWidgets-Info.plist
      properties:
        CFBundleDisplayName: MyRoboTaxi
        # THESE TWO MUST BE SUBSTITUTIONS, NOT LITERALS. With
        # GENERATE_INFOPLIST_FILE off, XcodeGen writes its own defaults for any
        # version key this block omits — which produced `CFBundleShortVersionString
        # = 1.0` against the app's `1.0.0`, a mismatch App Store Connect rejects at
        # upload and which nothing catches at build time. Referencing the build
        # settings instead means the extension tracks the app by construction,
        # including when RELEASING.md overrides CURRENT_PROJECT_VERSION on the
        # archive COMMAND LINE (which applies to every target at once, so a literal
        # here would silently stop matching on the very first real release).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.myrobotaxi.ios.widgets
        # MUST track the app target's values exactly. App Store Connect rejects a
        # bundle whose embedded extension disagrees with its host on either version
        # — and RELEASING.md overrides CURRENT_PROJECT_VERSION at archive time on
        # the COMMAND LINE, which applies to every target at once, so the committed
        # baselines simply have to match.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        # Same automatic-signing posture as the app target, for the same reason:
        # simulator builds need no profile (CODE_SIGNING_ALLOWED is NO for the
        # simulator SDK) so tests never prompt, and a device/Debug build resolves a
        # managed profile. The FULL-MANUAL release path does not set profiles here
        # — it names them by UUID in ExportOptions-Manual.plist, which now carries
        # an entry for this bundle id too. See RELEASING.md §3b.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NFKX777598
      configs:
        # MYR-172 — same per-target Release manual signing as the app, with THIS
        # target's own profile ("MyRoboTaxi Widgets App Store", zero capabilities
        # — see RELEASING.md). Export still re-signs by UUID from
        # ExportOptions-Manual.plist; this is what lets the ARCHIVE sign at all.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution: Thomas Nandola (NFKX777598)"
          PROVISIONING_PROFILE_SPECIFIER: MyRoboTaxi Widgets App Store

  # MYR-201 — app-side unit tests (adapter/contract mapping). Hosted by the app
  # target so `@testable import MyRoboTaxi` can reach the App-target types
  # (`Vehicle`, `VehicleTelemetrySnapshot`, `VehicleContractMapping`, the fleet).
  # Pure/no-network: contracts fixtures in, view models out.
  MyRoboTaxiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
    dependencies:
      - target: MyRoboTaxi
      - package: MyRoboTaxiKit
      - package: DesignSystem
      - package: contracts
        product: MyRobotaxiContracts
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.myrobotaxi.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MyRoboTaxi.app/MyRoboTaxi"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # MYR-236 round 2 — the sheet-feel measurement harness. A UI-test target
  # (distinct from the unit-test target above, which can't synthesize touches)
  # boots the `ownerHome` scene, performs a slow drag + fast flicks on the
  # draggable detent sheet, and asserts it tracks / crosses detents. The app
  # emits a per-frame (requested, rendered) height trace under
  # `MRT_SHEET_TRACE=1` that the CI step parses into an objective tracking-error
  # number for the PR body.
  MyRoboTaxiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: MyRoboTaxi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.myrobotaxi.ios.uitests
        TEST_TARGET_NAME: MyRoboTaxi

schemes:
  MyRoboTaxi:
    build:
      targets:
        MyRoboTaxi: all
    test:
      targets:
        - MyRoboTaxiTests
        - MyRoboTaxiUITests
    run:
      config: Debug
